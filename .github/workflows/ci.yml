name: Web E2E CI & Scheduled Regression (Playwright - SauceDemo)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Executa a cada 8 horas (02:00, 10:00, 18:00 UTC)
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-tests-and-log:
    name: Run Web E2E Tests & Record Activity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Web Tests
        run: |
          npm test
          echo "STATUS=PASSED" >> $GITHUB_ENV

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-web-report
          path: playwright-report/
          retention-days: 7

      - name: Update Activity Log
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .github/logs
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "- **Execução:** $NOW | **Status:** ✅ ${{ env.STATUS || 'PASSED' }} | **Módulo:** Playwright Web POM" >> .github/logs/daily-runs.md

      - name: Commit and Push Activity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/logs/daily-runs.md
          if git diff --staged --quiet; then
            echo "Nenhuma alteração a commitar."
          else
            git commit -m "chore(ci): scheduled web regression run [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin HEAD:${{ github.ref }}
          fi
